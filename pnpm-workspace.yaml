packages:
  - packages/*
blockExoticSubdeps: false
overrides:
  # web3@0.20.7 depends on this git fork of bignumber.js; pin to the
  # equivalent npm release so pnpm can resolve it reproducibly.
  "bignumber.js@git+https://github.com/frozeman/bignumber.js-nolookahead.git": 9.0.1
  # Pin all @types/react to 18 (antd@3 pulls @types/react@19 via react-slick,
  # and 15/18/19 coexisting breaks JSX element-type assignability).
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"
# pnpm 11 build-script policy: true = allowed to run postinstall,
# false = explicitly blocked (silences ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  core-js: true
  ejs: false
  es5-ext: true
  esbuild: true
  fsevents: true
  gifsicle: false
  jpegtran-bin: false
  keccak: true
  lint-staged: false
  ngrok: false
  optipng-bin: false
  pngquant-bin: false
  secp256k1: true
  spawn-sync: true
  uglifyjs-webpack-plugin: false
  # eth-lightwallet-next git dep (published as @gkgo/eth-lightwallet): allow
  # its prepare (npm run build) to build dist/ on install.
  "@gkgo/eth-lightwallet@https://codeload.github.com/gkgoat1/eth-lightwallet/tar.gz/8e263dda7064d3576eaad700e9ea13b662ce809f": true
minimumReleaseAgeExclude:
  - ox@0.14.54
  - viem@2.57.4
