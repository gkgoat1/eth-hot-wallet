packages:
  - packages/*
blockExoticSubdeps: false
overrides:
  # web3@0.20.7 depends on this git fork of bignumber.js; pin to the
  # equivalent npm release so pnpm can resolve it reproducibly.
  "bignumber.js@git+https://github.com/frozeman/bignumber.js-nolookahead.git":
    9.0.1
# pnpm 11 build-script policy: true = allowed to run postinstall,
# false = explicitly blocked (silences ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  core-js: true
  ejs: false
  es5-ext: true
  esbuild: true
  fsevents: true
  gifsicle: false
  jpegtran-bin: false
  keccak: true
  lint-staged: false
  ngrok: false
  optipng-bin: false
  pngquant-bin: false
  secp256k1: true
  spawn-sync: true
  uglifyjs-webpack-plugin: false
