packages:
  - packages/*
blockExoticSubdeps: false
overrides:
  # web3@0.20.7 depends on this git fork of bignumber.js; pin to the
  # equivalent npm release so pnpm can resolve it reproducibly.
  "bignumber.js@git+https://github.com/frozeman/bignumber.js-nolookahead.git": 9.0.1
# pnpm 11 build-script policy: true = allowed to run postinstall,
# false = explicitly blocked (silences ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  core-js: true
  ejs: false
  es5-ext: true
  esbuild: true
  fsevents: true
  gifsicle: false
  jpegtran-bin: false
  keccak: true
  lint-staged: false
  ngrok: false
  optipng-bin: false
  pngquant-bin: false
  secp256k1: true
  spawn-sync: true
  uglifyjs-webpack-plugin: false
  # eth-lightwallet-next git dep: allow its prepare (npm run build) to build dist/
  "eth-lightwallet@https://codeload.github.com/gkgoat1/eth-lightwallet/tar.gz/83c6e57c73d8524528100665dfeb39e5d52a7f99": true
  eth-lightwallet@https://codeload.github.com/gkgoat1/eth-lightwallet/tar.gz/5e0c9fa70c3f76d46c24c453c89d90db2b36f409: set this to true or false
minimumReleaseAgeExclude:
  - ox@0.14.54
  - viem@2.57.4
